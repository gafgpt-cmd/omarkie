name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ${{ fromJSON(vars.CI_ROUTE_M || '["ubicloud-standard-4-ubuntu-2204"]') }}
    # verify ends with test:perf (1 warmup + 5 measured rounds of fresh launches).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Electron 44 fetches its binary lazily on first require, and npm can never
      # restore the setuid bit its SUID sandbox helper needs. Fetch it up front,
      # then configure the helper before any desktop test launches Electron.
      - name: Fetch Electron and enable its sandbox helper
        run: |
          node -e "require('electron')"
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - run: npx playwright install --with-deps chromium
      - run: npx tsc -b
      - name: Install desktop verification dependencies
        run: sudo apt-get update && sudo apt-get install -y libreoffice-writer poppler-utils xvfb xauth
      - name: Install the latest Pandoc, verified against its release digest
        run: bash scripts/install-pandoc.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - run: flock -w 1800 /tmp/omarkie-electron.lock xvfb-run -a sh -c 'OMARKIE_TEST_DISPLAY="$DISPLAY" OMARKIE_TEST_HIDDEN=0 npm run verify'
        env:
          OMARKIE_REQUIRE_CONVERTERS: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-results
          path: test-results/perf/perf-results.json
          if-no-files-found: ignore

  chaos:
    # Daily-life chaos rows: unprivileged everywhere, plus the FUSE helper (no root at run time).
    runs-on: ${{ fromJSON(vars.CI_ROUTE_M || '["ubicloud-standard-4-ubuntu-2204"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y fuse3 libfuse3-dev gcc pkg-config
      - run: node tests/chaos/run.mjs --group js --json chaos-js.json
      - run: node tests/chaos/run.mjs --group fuse --json chaos-fuse.json
      - run: node tests/chaos/run.mjs --group regressions --json chaos-regressions.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chaos-results
          path: chaos-*.json

  chaos-drives:
    # Real loop-mounted vfat/exFAT/NTFS sticks. Needs passwordless sudo for losetup and mount;
    # runs on pushes and same-repo PRs (not external forks) and prints a notice when the runner has no sudo.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(vars.CI_ROUTE_M || '["ubicloud-standard-4-ubuntu-2204"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y dosfstools exfatprogs ntfs-3g util-linux e2fsprogs
      - name: Drive-image rows (root)
        run: |
          if sudo -n true 2>/dev/null; then
            sudo -n env PATH="$PATH" node tests/chaos/run.mjs --group drives --strict --json chaos-drives.json
          else
            echo "::notice::drives rows skipped: this runner needs passwordless sudo, losetup, mount, mkfs.vfat, mkfs.exfat, mkfs.ntfs"
            echo "drives rows skipped: runner needs passwordless sudo + loop devices (see tests/chaos/README.md)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chaos-drives
          path: chaos-drives.json
          if-no-files-found: ignore

  macos-native:
    # Fleet CI is Ubicloud Linux; the macOS runner is GitHub-hosted and runs
    # only on manual dispatch.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Pandoc
        run: brew install pandoc
      - run: npm run test:native
      - run: npm run test:webkit
