name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      - name: Install LibreOffice Writer
        run: sudo apt-get update && sudo apt-get install -y libreoffice-writer
      - name: Install the latest Pandoc, verified against its release digest
        run: bash scripts/install-pandoc.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm test
        env:
          OMARKIE_REQUIRE_CONVERTERS: "1"
